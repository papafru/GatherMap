name: Publish GatherMap v0.7.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v070.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply reviewed v0.7.0 GUI update
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, base64, zlib

          def git_blob_sha(blob):
              return hashlib.sha1(b"blob " + str(len(blob)).encode() + b"\0" + blob).hexdigest()

          f = Path("GatherMap.lua")
          old = f.read_text(encoding="utf-8")
          expected_before = "654b49a59312e34fa8b9f9e2acf4924b5e95cfe2"
          expected_after = "ee10b1f2756502296ff4e56db544b01b84e3c118"
          actual = git_blob_sha(old.encode("utf-8"))
          if actual != expected_after:
              assert actual == expected_before, "Unexpected main GatherMap.lua; refusing to overwrite newer source."
              gui = zlib.decompress(base64.b64decode("")).decode("utf-8")
              assert hashlib.sha256(gui.encode("utf-8")).hexdigest() == "7dddaf7a5599b7f57f8ef40f589b7f6356defe16317b7f162d66e56b22933ac2"
              start = old.index("local function CreateOptionsFrame()")
              end = old.index("local function PositionMinimapButton()", start)
              updated = old[:start] + gui + old[end:]
              assert git_blob_sha(updated.encode("utf-8")) == expected_after, "GUI content does not match the tested v0.7.0 ZIP"
              f.write_text(updated, encoding="utf-8")

          toc = Path("GatherMap.toc")
          source = toc.read_text(encoding="utf-8")
          if "## Version: 0.7.0" not in source:
              assert git_blob_sha(source.encode("utf-8")) == "0234b5de79aa70e673c29cde73d1cd698672ae48"
              toc.write_text(source.replace("## Version: 0.6.9", "## Version: 0.7.0"), encoding="utf-8")
          assert git_blob_sha(toc.read_bytes()) == "0088f12a908d14f10a4ec3dcd8a73d920038b4ba"

          readme = Path("README.md")
          md = readme.read_text(encoding="utf-8")
          if "Version 0.7.0 introduces" not in md:
              assert git_blob_sha(md.encode("utf-8")) == "9abc5612cf9aad90e75663163d83a5d866e7571d"
              addition = """## Settings GUI and minimap button

          Version 0.7.0 introduces the World Chat Filter-inspired dark charcoal/arcane-blue
          interface with muted gold text and bronze outlines, custom dark buttons and
          tabs, subtle green checkbox indicators, and a unified three-tab layout.
          The change is visual only: filters, learned data, sliders, and import/export
          behave as before.
          """
              md = md.replace("## Settings GUI and minimap button", addition)
              readme.write_text(md, encoding="utf-8")
          assert git_blob_sha(readme.read_bytes()) == "927d0afb9b63e5bbdafa6aabfe11c02b56ad6999"
          print("Verified v0.7.0 source SHA hashes against the tested package.")
          PY

      - name: Commit v0.7.0 to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GatherMap.lua GatherMap.toc README.md
          if ! git diff --cached --quiet; then
            git commit -m "Release v0.7.0: dark themed settings GUI"
            git push origin HEAD:main
          fi

      - name: Package source as addon ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          out = Path("GatherMap-v0.7.0-Turtle-1.18.zip")
          with ZipFile(out, "w", ZIP_DEFLATED, compresslevel=8) as archive:
              for p in sorted(Path(".").rglob("*")):
                  if not p.is_file() or p == out or any(part.startswith(".") for part in p.parts):
                      continue
                  archive.write(p, "GatherMap/" + p.as_posix())
          print("Created " + str(out) + ": " + str(out.stat().st_size) + " bytes")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.txt <<'EOF'
          ## GatherMap v0.7.0 — Dark GUI

          - Completely redesigned the settings interface with deep charcoal/arcane-blue panels, muted gold text and bronze borders.
          - Replaced red Blizzard buttons with custom dark buttons and subtle hover feedback.
          - Redesigned all three tabs: General, Node Tracking, Import / Export.
          - Added compact dark checkboxes with green enabled indicators, cohesive input fields and scrollable lists.
          - Improved General layout with two columns and better spacing.
          - No change to resource recording, saved locations, pfQuest presets, icon-size controls or import/export functionality.
          - Existing SavedVariables are preserved.

          Compatible with Turtle WoW 1.18 (Vanilla 1.12 API).

          Install: Extract the ZIP into Interface/AddOns, leaving a GatherMap folder. Back up your current folder and SavedVariables first.
          EOF
          if gh release view v0.7.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.7.0 GatherMap-v0.7.0-Turtle-1.18.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.7.0 GatherMap-v0.7.0-Turtle-1.18.zip --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title "GatherMap v0.7.0 — Dark GUI" --notes-file release-notes.txt
          fi
